name: Build Android APK (Triple Tile Match)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Backup game files & generate full Android Gradle project
        run: |
          cp lib/main.dart /tmp/main_backup.dart
          cp pubspec.yaml /tmp/pubspec_backup.yaml
          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest_backup.xml
          fi
          flutter create . --project-name triple_tile_match --org com.chromaproduction
          cp /tmp/main_backup.dart lib/main.dart
          cp /tmp/pubspec_backup.yaml pubspec.yaml
          if [ -f /tmp/AndroidManifest_backup.xml ]; then
            cp /tmp/AndroidManifest_backup.xml android/app/src/main/AndroidManifest.xml
          fi
          rm -rf test

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload Ready APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Triple-Tile-Match-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
